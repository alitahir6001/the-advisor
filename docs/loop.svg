<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-label="A task goes to the workhorse running a cheaper model, which sends a question and context to the advisor running a stronger model on any provider, and gets advice back.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <rect x="20" y="70" width="100" height="64" rx="6" fill="#5F5E5A"/>
    <text x="70" y="102" fill="#F1EFE8" font-size="14" text-anchor="middle" dominant-baseline="central">Your task</text>

    <line x1="128" y1="102" x2="147" y2="102" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="155" y="70" width="185" height="64" rx="6" fill="#0F6E56"/>
    <text x="247" y="92" fill="#E1F5EE" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">Workhorse</text>
    <text x="247" y="114" fill="#9FE1CB" font-size="12" text-anchor="middle" dominant-baseline="central">a cheaper model does the work</text>

    <text x="407" y="54" fill="#888780" font-size="12" text-anchor="middle" dominant-baseline="central">question + context</text>
    <line x1="348" y1="88" x2="467" y2="88" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="467" y1="116" x2="348" y2="116" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="407" y="150" fill="#888780" font-size="12" text-anchor="middle" dominant-baseline="central">advice</text>

    <rect x="475" y="70" width="225" height="64" rx="6" fill="#534AB7"/>
    <text x="587" y="92" fill="#EEEDFE" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">Advisor</text>
    <text x="587" y="114" fill="#CECBF6" font-size="12" text-anchor="middle" dominant-baseline="central">stronger model, any provider</text>
  </g>
</svg>
