<svg xmlns="http://www.w3.org/2000/svg" width="720" height="216" viewBox="0 0 720 216" role="img" aria-label="Of the three consult surfaces, only the advisor agent description is always in context, so it carries the mandatory escalation rule. The MCP tool and the skills load later or on trigger and are deliberately non-directive.">
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <rect x="30" y="40" width="200" height="56" rx="6" fill="#0F6E56"/>
    <text x="130" y="60" fill="#E1F5EE" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">Advisor agent</text>
    <text x="130" y="80" fill="#9FE1CB" font-size="12" text-anchor="middle" dominant-baseline="central">always in context</text>

    <rect x="260" y="40" width="200" height="56" rx="6" fill="#5F5E5A"/>
    <text x="360" y="60" fill="#F1EFE8" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">MCP consult tool</text>
    <text x="360" y="80" fill="#D3D1C7" font-size="12" text-anchor="middle" dominant-baseline="central">deferred, loads later</text>

    <rect x="490" y="40" width="200" height="56" rx="6" fill="#5F5E5A"/>
    <text x="590" y="60" fill="#F1EFE8" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">Advisor skills</text>
    <text x="590" y="80" fill="#D3D1C7" font-size="12" text-anchor="middle" dominant-baseline="central">load on trigger</text>

    <line x1="130" y1="96" x2="130" y2="132" stroke="#888780" stroke-width="1.5" marker-end="url(#d)"/>
    <line x1="360" y1="96" x2="360" y2="132" stroke="#888780" stroke-width="1.5" marker-end="url(#d)"/>
    <line x1="590" y1="96" x2="590" y2="132" stroke="#888780" stroke-width="1.5" marker-end="url(#d)"/>

    <rect x="30" y="140" width="200" height="56" rx="6" fill="#0F6E56"/>
    <text x="130" y="160" fill="#E1F5EE" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">Carries the MUST</text>
    <text x="130" y="180" fill="#9FE1CB" font-size="12" text-anchor="middle" dominant-baseline="central">only always-on surface</text>

    <rect x="260" y="140" width="430" height="56" rx="6" fill="#5F5E5A"/>
    <text x="475" y="160" fill="#F1EFE8" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">Non-directive</text>
    <text x="475" y="180" fill="#D3D1C7" font-size="12" text-anchor="middle" dominant-baseline="central">avoid competing mandates</text>
  </g>
</svg>
